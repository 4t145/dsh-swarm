# Standalone local overlay over the shipped headless profile.
# Build/link the checkout first. Do not also apply cordis.patch.yml.
# dsh --profile headless --patch /abs/path/cordis.headless.yml -- --help
# dsh --profile headless --patch /abs/path/cordis.headless.yml --spec /abs/run.json --json
- id: headless-startup
  disabled: true
- id: headless-runner
  disabled: true
- insert:
    - id: swarm-headless-presets
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
    - id: swarm-cli-worktrees
      name: '@deepseek-ai/dsh-experimental-worktree'
    - id: swarm-cli-runtime
      name: './lib/index.js'
      config:
        eventPageSize: 20
        commandOutputBytes: 262144
        commandGraceMs: 3000
        storageDomainName: local_swarm_headless
    - id: preset-swarm-worker
      name: './lib/headless-preset.js'
    - id: swarm-headless-driver
      name: './lib/headless-driver.js'
